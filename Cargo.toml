[workspace]
resolver = "2"
members = ["feml-core", "feml-cpu", "feml-opencl", "feml-cuda"]
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
feml-core = { path = "feml-core" }
ocl = { version = "0.19" }
cudarc = { version = "0.19.9", features = ["cuda-13000"] }
